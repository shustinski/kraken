; Contour runtime configuration. Restart the application after editing.

[profiling]
; Master switch. A per-profiler switch below has priority.
enabled = false
log_file = profiling.log
max_log_bytes = 5242880
backup_count = 3
top_lines = 40

; Leave a value empty to inherit "enabled"; set true/false for an override.
frame_switch =
processing =
thumbnail =
thumbnail_full_functions = false
vertex_move =
move_vertex_tool =
delete_area =
contact_placement =
contact_multi_selection =
contact_deletion =
contact_copy =
contact_paste =
contact_undo =
contact_redo =
contact_drag =
scene_zoom =
image_recognition =
filter_application =
polygon_change =

frame_switch_top_lines = 80
processing_top_lines = 25
thumbnail_top_lines = 25
vertex_move_top_lines = 40
frame_switch_idle_polls = 300

[shortcuts]
undo = Ctrl+Z
redo = Ctrl+Y
copy = Ctrl+C
cut = Ctrl+X
paste = Ctrl+V
fit_view = F
hold_vectors = Space
hold_source_image = X
finish_polygon = Enter; Return
cancel = Esc
delete_selection = Del
delete_pipeline_step = Del; Backspace
cycle_tool_mode = Shift
return_to_kraken = Ctrl+Shift+Return
frame_previous = Ctrl+Left
frame_next = Ctrl+Right
frame_previous_row = Ctrl+Up
frame_next_row = Ctrl+Down

tool_select = V
tool_select_area =
tool_pan = H
tool_ruler = K
tool_add_polygon = P
tool_brush = B
tool_trace_pen = T
tool_add_via = U
tool_add_vertex = A
tool_delete_vertex = D
tool_move_vertex = M
tool_antialias =
tool_delete_polygon =

[window]
width = 1680
height = 980

[editor]
default_zoom_step_factor = 1.15
wheel_zoom_step_factor = 1.28
min_zoom_factor = 0.08
max_zoom_factor = 32.0
wheel_zoom_coalesce_ms = 3
zoom_animation_frame_ms = 16
zoom_easing_fraction = 0.55
zoom_settle_ratio = 0.001
zoom_vector_batch_threshold = 1000
pyramid_visible_update_ms = 24
pyramid_cache_limit = 192
opengl_viewport_enabled = true
min_manual_stroke_width_px = 2.0

[large_dataset]
frame_count_threshold = 750
thumbnail_icons_apply_per_tick = 8
thumbnail_apply_interval_ms = 16
thumbnail_visible_load_debounce_ms = 120
thumbnail_scroll_settle_ms = 150
thumbnail_max_active_decodes = 6
thumbnail_radial_loads_per_pump = 2
thumbnail_radial_pump_interval_ms = 24
thumbnail_max_source_width = 512
thumbnail_max_source_height = 512
