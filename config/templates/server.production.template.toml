# Шаблон промышленного Kraken Server.
# Рабочий файл создаёт `kraken-admin init` или `kraken-admin setup-server`.
# Пароль базы здесь хранить нельзя.

[server]
# 127.0.0.1, если HTTPS завершает reverse proxy на этой машине.
# Сетевой интерфейс указывайте только вместе с TLS.
host = "127.0.0.1"
port = 8080
project_access_mode = "acl"

# none — без журнала обращений.
# low — создание проектов и учётных записей.
# medium — дополнительно создание слоёв и загрузка данных.
# high — каждое обращение к серверу.
log_level = "low"

# tls_cert_file = "C:/ProgramData/Kraken/Server/tls/server.crt"
# tls_key_file = "C:/ProgramData/Kraken/Server/tls/server.key"

[database]
url_secret = "database-url.secret"
pool_size = 10
max_overflow = 10

[storage]
# Резервируйте каталог вместе с PostgreSQL и конфигурацией сервера.
blob_root = "D:/KrakenData/blobs"
# Исходные типы img, ssc, prv, aux: source_root/<проект>/<тип>.
# Производные типы dataset, result, vector: derived_root/<проект>/<тип>.
# Корни могут совпадать и быть локальным диском или UNC.
source_root = "D:/KrakenData/source"
derived_root = "D:/KrakenData/derived"

[blob_gateway]
# Клиенты ходят на public_url напрямую. Вне loopback разрешён только HTTPS.
enabled = true
public_url = "https://kraken-files.example.org"
bind = "0.0.0.0:8081"
executable = "C:/Program Files/Kraken Server/KrakenBlobGateway.exe"
secret = "blob-gateway.secret"
ticket_lifetime_seconds = 900
tls_cert_file = "C:/ProgramData/Kraken/Server/tls/server.crt"
tls_key_file = "C:/ProgramData/Kraken/Server/tls/server.key"

[identity]
# gitlab_issuer = "https://gitlab.example.org"
# gitlab_ca_file = "C:/ProgramData/Kraken/Server/ca/internal-ca.pem"
