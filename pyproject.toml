[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken"
version = "0.1.0"
description = "Kraken project manager, server, agent and shared plugin runtime."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
desktop = [
    "PyQt6>=6.6",
    "keyring>=25.0",
]
server = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]
postgres = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]
reports = [
    "openpyxl>=3.1",
    "reportlab>=4.2",
]
packages = [
    "cryptography>=43.0",
]
dev = [
    "PyQt6>=6.6",
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
kraken-hub = "kraken_hub.__main__:main"
kraken-server = "kraken_server.__main__:main"
kraken-agent = "kraken_agent.__main__:main"
kraken-admin = "kraken_server.cli:main"

[project.entry-points."kraken.storage_backends"]
filesystem = "kraken_manager.infrastructure.filesystem.registration:backend_registration"
postgresql = "kraken_manager.infrastructure.postgres.registration:backend_registration"

[project.entry-points."kraken.blob_backends"]
filesystem = "kraken_manager.infrastructure.blob.registration:blob_registration"

[project.entry-points."kraken.thumbnail_stores"]
files = "kraken_core.frame_matrix.adapters.filesystem:FilesystemThumbnailStore"
sqlite = "kraken_core.frame_matrix.adapters.sqlite:ShardedSQLiteThumbnailStore"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kraken_core*", "kraken_hub*", "kraken_manager*", "kraken_server*", "kraken_agent*"]

[tool.setuptools.package-data]
kraken_hub = ["resources/*.json"]
kraken_core = [
    "resources/styles/*.qss",
    "resources/styles/icons/*.svg",
    "resources/icons/*",
]

[tool.uv.workspace]
members = [
    "plugins/neuralimage",
    "plugins/contour",
    "plugins/krona",
    "plugins/csliser",
    "plugins/karakal",
    "plugins/kategb",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' or sys_platform == 'linux'",
]

[tool.pytest.ini_options]
minversion = "8.0"
markers = [
    "performance: hardware-sensitive performance and regression tests",
]
testpaths = ["tests", "plugins"]
pythonpath = [
    "src",
    "plugins/neuralimage/src",
    "plugins/contour/src",
    "plugins/krona/src",
    "plugins/csliser/src",
    "plugins/karakal/src",
    "plugins/kategb/src",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py314"
