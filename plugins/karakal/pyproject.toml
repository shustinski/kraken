[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karakal"
version = "1.0.0"
description = "Kraken Qt plugin for frame-matrix validation, model comparison, and cell-defect inspection."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kraken",
    "numpy>=1.26",
    "opencv-python>=5.0",
    "PyQt6>=6.6",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]
build = [
    "build>=1.2",
    "pyinstaller>=6.0",
]
[tool.uv.sources]
kraken = { workspace = true }

[project.scripts]
karakal = "karakal.__main__:main"
karakal-worker = "karakal.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["karakal", "karakal.*"]

[tool.setuptools.package-data]
karakal = ["resources/**/*"]
