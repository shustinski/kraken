services:
  neuralimage:
    build:
      context: ../../..
      dockerfile: plugins/neuralimage/docker/Dockerfile
    ports:
      - "8765:8765"
    gpus: all
    init: true
    shm_size: "2gb"
    stop_grace_period: 90s
    restart: unless-stopped
    volumes:
      - neuralimage-data:/data
volumes:
  neuralimage-data:
