[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartograph"
version = "0.1.0"
description = "Kraken plugin for local SEM-frame navigation and 3x3 stitching."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kraken",
    "numpy>=2.0",
    "opencv-python>=4.13",
    "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[tool.uv.sources]
kraken = { workspace = true }

[project.scripts]
cartograph = "cartograph.application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cartograph", "cartograph.*"]

[tool.setuptools.package-data]
cartograph = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["build", "dist", ".venv"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
